# merchant-risk-screener configuration

seed: 416

paths:
  fixtures: fixtures
  decisions: decisions
  reports: reports

# ---------------------------------------------------------------------------
# LLM routing — every AI task resolves its model here; override per run with
# LLM_MODEL_<TASK> env vars or --model flags. Backends as in config comments of
# llm/client.py (cli = Claude Code-compatible CLI via CLAUDE_CLI_BIN; api =
# anthropic SDK). Eval-set responses are cached and committed: offline repro.
# ---------------------------------------------------------------------------
llm:
  backend: cli
  temperature: 0
  max_retries: 2
  tasks:
    merchant_categorize:        # site text -> policy category taxonomy + confidence
      model: claude-haiku-4-5-20251001
      prompt_version: categorize_v1
    policy_screen:              # site text vs AUP-1 -> per-section verdicts w/ quotes
      model: claude-sonnet-5
      prompt_version: screen_v2
      eval_arms: [claude-sonnet-5, claude-haiku-4-5-20251001]
    review_themes:              # review corpus -> theme shares + quotes + NPS proxy
      model: claude-sonnet-5
      prompt_version: themes_v1
    monitor_memo:               # merchant health metrics -> investigation memo
      model: gpt-6.1-sol
      prompt_version: monitor_v2

scorecard:
  # weights (one-line rationale each; policy/acceptable-use.md governs intent)
  weights:
    domain_age_under_30d: 30      # brand-new domains carry no history to trust
    domain_age_under_180d: 15     # young but not newborn
    missing_refund_policy: 20     # AUP-H1; predicts refund-refusal disputes
    missing_shipping_policy: 10   # AUP-H2
    missing_contact: 15           # AUP-H3; unreachable merchants convert to chargebacks
    missing_terms: 5              # AUP-H4
    no_tls: 10                    # AUP-H5
    hygiene_cap: 25               # AUP-03: page gaps correlate; cap combined hygiene points
    restricted_category: 25       # AUP-02 tier carries structural risk
    review_nondelivery_over_20pct: 20  # AUP-04.ND mid tier: concerning, needs corroboration
    review_nondelivery_over_40pct: 55  # AUP-04.1: overwhelming non-delivery is decline-grade alone
    review_counterfeit_any: 40    # AUP-04.CF / AUP-01.7
    review_refund_refusal_over_15pct: 20  # AUP-04.RR
    review_subscription_trap: 15  # AUP-04.ST
    geo_claim_inconsistency: 15   # claimed country vs signals mismatch
  bands:
    approve_max: 25
    conditional_max: 50           # approve with limits + rolling reserve suggestion
    manual_max: 84                # human underwriter review
    # >= 85 -> decline
  # hard overrides regardless of score:
  #   any prohibited verdict -> decline
  #   any insufficient-info verdict -> manual_review (fail-safe direction)

monitor:
  rule_set: s1                  # adopted by the iteration-2 dev gate (monitor/ITERATION.md §4.3)
  c3_young: c1b                  # best young-merchant variant on dev (selection output)
  window_days: 30                # trailing window includes the current known-event day
  baseline_days: 90              # completed prior window excludes the trailing 30 days
  min_orders_30d: 20             # thin trailing denominators leave rates undefined
  min_base_days: 30              # require a month of prior calendar history
  min_base_orders: 20            # prior volume must support a baseline comparison
  min_days_since_first_order: 14 # eligibility is checked on each replay day
  min_cum_orders: 30             # require approved volume known by that replay day
  min_disputes: 3                # rate triggers require several observed disputes
  min_triggers: 2                # corroborate warnings; a breach can alert alone
  episode_suppression_days: 90   # days 1 through 90 suppress repeat episodes
  dispute_flag_min: 3            # auxiliary surveillance regardless of order volume
  chargeback_warn: 0.015          # values illustrative, modeled on public monitoring-
  chargeback_breach: 0.025        # program concepts, not any network's actual numbers
  volume_zscore_alert: 3.0        # Poisson floor avoids overstating stable low-volume ramps
  ticket_drift_alert: 2.0        # compare GMV per order with the completed baseline
  new_account_gmv_share_alert: 0.40 # concentration is weighted by GMV, not order counts
  refund_base_min: 0.02          # collapse needs a previously material refund rate
  refund_recent_max: 0.005       # near-zero refunds alongside disputes justify review
  young_variants:                # predeclared concentration alternatives for dev selection
    c1a: {age_days: 90, gmv_share: 0.40}  # young merchants with thin-account exposure
    c1b: {age_days: 90, gmv_share: 0.60}  # stronger concentration in the same age band
    c1c: {age_days: 180, gmv_share: 0.40} # broader age band at the control share threshold
  selection_workload_max: 5.0    # episodes per 100 eligible merchant-quarters on dev only
  merchant_quarter_days: 91.3125 # convert unsuppressed eligible days into quarter exposure
  # iteration 2 (monitor/ITERATION.md §4): parameters fixed before any iteration-2 run
  chargeback_evidence_max_p: 0.05 # a level is reached only when lower rates rarely give the count
  fulfilment_reasons: [item_not_received, not_as_described]  # K2 counts these allegations only
  iteration2_young: c1b          # Y carried forward unchanged from iteration 1
  delivery:
    deadline_quantile: 0.95      # overdue once later than 95% of confirmed deliveries
    cohort_days: 7               # a week of shipments that have reached the deadline
    min_unconfirmed: 3           # never pause settlement over one or two parcels
    max_p: 0.00005               # ~91 daily looks per quarter: ~0.46 nominal noise per 100
    reference_upper_confidence: 0.99  # an upper bound on p_ref can only make X harder to fire
    calibration_shipped_by: "2024-07-31"  # every lag shipment has 31 days of follow-up
    calibration_known_by: "2024-08-31"    # nothing later enters D or p_ref
    calibration: reports/monitoring_delivery_calibration.json
  ladder: [s1, s2, s3, s4]       # registered adoption order: first within both ceilings
  delivery_review_max: 1.0       # settlement-pause reviews per 100 eligible merchant-quarters
